# Track Q configuration (new file — does not touch config/config.yaml).
# CODE READY — UNTESTED
models:
  base_model: qwen3:8b
  lora_model: qwen3-8b-lora-r1
  num_ctx: 2048
  num_predict: 1024
  temperature: 0.6
  top_p: 0.95

phase3:
  n: 1000
  seed: 43
  budgets: [256, 512, 1024]
  # Runtime state lives under track_q/phase_3 (single source of truth:
  # src/stockml/qpipeline/paths.py). Paths are relative to the repo root so
  # the tree is portable between local PC and Colab.
  ledger_path: "track_q/phase_3/data/q3_thinking_cap_ledger.jsonl"
  results_path: "track_q/phase_3/results/q3_thinking_cap.json"
  trace_dir: "track_q/phase_3/traces"

star:
  cutoff: "2023-08-24"
  # Phases 4/5 live in track_q/phase_4 and track_q/phase_5 when they first run.
  pool_a_path: "track_q/phase_4/data/pool_a.parquet"
  candidates_path: "track_q/phase_4/data/star_candidates.jsonl"
  kept_path: "track_q/phase_5/data/star_kept.jsonl"
  dropped_path: "track_q/phase_5/data/star_dropped.jsonl"
  audit_template_path: "track_q/phase_5/results/star_audit_template.csv"
  audit_results_path: "track_q/phase_5/results/star_audit_results.csv"
  report_path: "track_q/phase_5/results/phase5_filter_audit.json"
  trace_dir: "track_q/phase_4/traces"
  default_sample_size: 5000
  default_seed: 43
  relevance_min: 0.5
  audit_n: 200

nightly:
  ledger_path: "track_q/phase_7/data/qwen_nightly_ledger.parquet"
  results_path: "track_q/phase_7/results/qwen_nightly.json"
  trace_dir: "track_q/phase_7/traces"
  default_thinking_budget: 512

phase6:
  adapter_dir: "track_q/phase_6/adapter/qwen_lora_r1"
  checkpoint_dir: "track_q/phase_6/checkpoints"
  train_jsonl: "track_q/phase_5/data/star_kept.jsonl"
  eval_jsonl: "track_q/phase_5/data/star_val.jsonl"
  results_path: "track_q/phase_6/results/qwen_qlora.json"
  probe_results_path: "track_q/phase_6/results/qwen_10step_probe.json"
  seq_len: 4096
  fallback_seq_len: 3072
  fallback_rank: 8
  rank: 16
  alpha: 32
  dropout: 0.05
  learning_rate: 0.0002
  micro_batch_size: 1
  grad_accum: 16
  seed: 42
  max_steps_probe: 10

phase8:
  holdout_start: "2023-08-29"
  embargo_days: 5
  results_path: "track_q/phase_8/results/q8_ablation.json"
  touch_ledger_path: "track_q/phase_8/results/holdout_touches.jsonl"
  n_bootstrap: 1000
  bootstrap_seed: 42
  alpha: 0.05

runner:
  # The pipeline refuses to start a phase if the previous phase is not PASSED
  # in track_q/_common/phase_registry.json. Q0 is checked separately from
  # track_q/phase_0/verdict/q0_d1.json (complete=true AND pass=true).
  # phase6_probe reads star_kept.jsonl (written by phase5), so it MUST run after
  # phase5 — not before it.
  order:
    - phase3
    - phase4
    - phase5
    - phase6_probe
    - phase6_train
    - phase7
    - phase8
