# Track Q configuration (new file — does not touch config/config.yaml).
# CODE READY — UNTESTED
models:
  base_model: qwen3:8b
  lora_model: qwen3-8b-lora-r1
  num_ctx: 2048
  num_predict: 1024
  temperature: 0.6
  top_p: 0.95

phase3:
  n: 1000
  seed: 43
  budgets: [256, 512, 1024]
  ledger_path: "data/llm/q3_thinking_cap_ledger.jsonl"
  results_path: "results/q3_thinking_cap.json"
  trace_dir: "results/traces_q3"

star:
  cutoff: "2023-08-24"
  pool_a_path: "data/llm/pool_a.parquet"
  candidates_path: "data/llm/star_candidates.jsonl"
  kept_path: "data/llm/star_kept.jsonl"
  dropped_path: "data/llm/star_dropped.jsonl"
  audit_template_path: "results/star_audit_template.csv"
  audit_results_path: "results/star_audit_results.csv"
  report_path: "results/phase5_filter_audit.json"
  trace_dir: "results/traces_star"
  default_sample_size: 5000
  default_seed: 43
  relevance_min: 0.5
  audit_n: 200

nightly:
  ledger_path: "data/llm/qwen_nightly_ledger.parquet"
  results_path: "results/qwen_nightly.json"
  trace_dir: "results/traces_q7"
  default_thinking_budget: 512

phase6:
  adapter_dir: "artifacts/models/qwen_lora_r1"
  checkpoint_dir: "checkpoints/qwen_lora"
  train_jsonl: "data/llm/star_kept.jsonl"
  eval_jsonl: "data/llm/star_val.jsonl"
  results_path: "results/qwen_qlora.json"
  probe_results_path: "results/qwen_10step_probe.json"
  seq_len: 4096
  fallback_seq_len: 3072
  fallback_rank: 8
  rank: 16
  alpha: 32
  dropout: 0.05
  learning_rate: 0.0002
  micro_batch_size: 1
  grad_accum: 16
  seed: 42
  max_steps_probe: 10

phase8:
  holdout_start: "2023-08-29"
  embargo_days: 5
  results_path: "results/q8_ablation.json"
  touch_ledger_path: "results/holdout_touches.jsonl"
  n_bootstrap: 1000
  bootstrap_seed: 42
  alpha: 0.05

runner:
  # The pipeline refuses to start a phase if the previous phase is not PASSED
  # in artifacts/state/q_track_state.json. Q0 is checked separately from
  # results/q0_d1.json (complete=true AND pass=true).
  order:
    - phase3
    - phase6_probe
    - phase4
    - phase5
    - phase6_train
    - phase7
    - phase8
