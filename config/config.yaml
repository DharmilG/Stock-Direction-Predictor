project_name: stock-direction-platform
environment: local
enable_news: true
enable_sentiment: true
news_provider: alphavantage,gdelt
news_gdelt_days: 90
history_years: 16
interval: 1d
market_data_provider: yfinance
# B-01/F-01 (Week 2): NIFTY 50 static list, Sept-2026 composition, cross-checked
# against two independent sources. INTERIM per §6.2: static membership backfilled
# to 2010 carries survivorship bias (every training stock survived to 2026).
# Proper point-in-time universe_history.json is B-11 (Week 5). Bias is documented,
# never silent.
universe_tier: nifty50
symbols:
  - RELIANCE.NS
  - BHARTIARTL.NS
  - HDFCBANK.NS
  - ICICIBANK.NS
  - SBIN.NS
  - TCS.NS
  - BAJFINANCE.NS
  - LT.NS
  - HINDUNILVR.NS
  - TITAN.NS
  - SUNPHARMA.NS
  - INFY.NS
  - KOTAKBANK.NS
  - ADANIENT.NS
  - ADANIPORTS.NS
  - MARUTI.NS
  - AXISBANK.NS
  - M&M.NS
  - HCLTECH.NS
  - ITC.NS
  - ULTRACEMCO.NS
  - NTPC.NS
  - BAJAJ-AUTO.NS
  - ETERNAL.NS
  - JSWSTEEL.NS
  - BAJAJFINSV.NS
  - BEL.NS
  - ONGC.NS
  - COALINDIA.NS
  - POWERGRID.NS
  - SHRIRAMFIN.NS
  - ASIANPAINT.NS
  - TATASTEEL.NS
  - GRASIM.NS
  - HINDALCO.NS
  - EICHERMOT.NS
  - INDIGO.NS
  - SBILIFE.NS
  - WIPRO.NS
  - JIOFIN.NS
  - TECHM.NS
  - TRENT.NS
  - APOLLOHOSP.NS
  - HDFCLIFE.NS
  - TMPV.NS
  - CIPLA.NS
  - MAXHEALTH.NS
  - TATACONSUM.NS
  - DRREDDY.NS
  - NESTLEIND.NS

features:
  return_windows: [1, 3, 5, 10, 20, 60]
  sma_windows: [5, 10, 20, 50, 100, 200]
  ema_windows: [10, 20, 50]
  volatility_windows: [5, 10, 20, 60]
  volume_windows: [5, 20, 60]
  rsi_window: 14
  atr_window: 14
  bollinger_window: 20
  fractional_d_windows: [0.3, 0.5]
  include_market_relative: true
  include_macro: true
  include_sentiment: true
  include_news: true
  include_calendar_context: true
  # F-12: source columns ranked cross-sectionally each session (groupby timestamp,
  # percentile rank — no shift, all same-day closes known by 15:30 IST per §7.3).
  xs_rank_sources: [ret_5, ret_20, ret_60, momentum_20, volatility_20, volatility_60, relative_volume_20, volume_z_20, rsi_14, macd_hist, atr_pct_14, bb_position, obv_z20]

target:
  method: triple_barrier
  # G1-R(a) verdict: horizon 10 TESTED 2026-09-15 and LOST (edge -2.49pp vs
  # -1.45pp at horizon 5; AUC 0.5520 vs 0.5599; MCC 0.015 vs 0.037 — longer
  # horizon skewed labels further UP and halved independent events).
  # Reverted to horizon 5, the better-verified operating point.
  horizon_days: 5
  volatility_window: 20
  upper_multiplier: 1.0
  lower_multiplier: 1.0
  flat_band: 1.0

validation:
  n_splits: 5
  purge_days: 5
  embargo_days: 5

training:
  optuna_trials: 25
  optuna_pruner: none
  class_weighting: true
  num_boost_round: 1000
  early_stopping_rounds: 100
  checkpoint_every_rounds: 1
  random_seed: 42

backtest:
  # B-04/F-09 (Week 2): segment-aware Indian costs. Delivery round trip =
  # 2*(commission+slippage+other) + 2*10 STT + 1.5 stamp(buy) = 31.5 bps,
  # inside the §6.3 realistic 25–35 bps band. Futures = 2*base + 5 STT(sell).
  segment: delivery
  commission_bps: 1.0
  slippage_bps: 3.0
  other_cost_bps: 1.0
  # G1-R(c): threshold 0.60 — sweep showed 8.4% coverage at 51.5% acc
  # (edge +3.7pp over majority) vs 20% at 50.1%. The system abstains by design.
  confidence_threshold: 0.60
  position_per_signal: 1.0
  max_gross_exposure: 1.0

decision:
  # Track F (Issue #2): FLAT has ranking skill (AUC 0.622) without F1
  # (0.207) — decision-boundary problem. Predict FLAT iff p_flat >= tau,
  # else argmax(DOWN, UP). Tuned on calibration (tau=0.40, +0.52pp test,
  # DM p≈6e-20, no class tradeoff). Same thresholds were REJECTED for UP
  # (AUC 0.518 — no ranking to convert); correct here for the mirror reason.
  flat_threshold: 0.40

monitoring:
  drift_lookback: 20
  psi_buckets: 10
  drift_psi_threshold: 0.25
