[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chartsense"
version = "0.1.0"
description = "Computer vision system for candlestick chart pattern detection"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["chartsense*"]